# =============================================================================
# AYROVI Warehouse Core — Render Blueprint (auto-deploy config)
# Deploy via: Render dashboard -> New -> Blueprint -> pick the Core-wh repo.
# Render will read this file and create the database + web service itself.
# =============================================================================

databases:
  - name: ayrovi-warehouse-db
    plan: free
    databaseName: ayrovi_warehouse
    user: ayrovi

services:
  - type: web
    name: ayrovi-warehouse-core
    runtime: node
    plan: free
    # Builds the React SPA, then installs + builds the NestJS backend, then
    # copies the freshly built SPA into backend/public (the single-bundle model).
    buildCommand: |
      cd frontend &&
      npm install &&
      npm run build &&
      cd ../backend &&
      npm install &&
      npx prisma generate &&
      npm run build &&
      mkdir -p public &&
      cp -r ../frontend/dist/* public/ &&
      npx prisma migrate deploy
    startCommand: node backend/dist/main.js
    healthCheckPath: /api/v1/system/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        fromDatabase:
          name: ayrovi-warehouse-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: SWAGGER_ENABLED
        value: "true"
      - key: CORS_ORIGINS
        value: https://ayrovi-warehouse-core.onrender.com
      - key: INITIAL_ADMIN_CODE
        value: ADMIN001
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
