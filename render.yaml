# =============================================================================
# AYROVI Warehouse Core — Render Blueprint (auto-deploy config)
#
# Deploy via: Render dashboard -> New -> Blueprint -> pick the Core-wh repo.
# Render reads this file and creates the database + web service itself.
#
# NOTE: The build delegates to ./build.sh, which installs devDependencies
# explicitly so the build is NOT affected by Render's NODE_ENV=production.
# Database migrations run at BOOT via ./start.sh, never during the build.
# =============================================================================

databases:
  - name: ayrovi-warehouse-db
    plan: free
    databaseName: ayrovi_warehouse
    user: ayrovi

services:
  - type: web
    name: ayrovi-warehouse-core
    runtime: node
    plan: free
    buildCommand: ./build.sh
    # Migrations + seed run here (release phase), NOT during build. See start.sh.
    startCommand: ./start.sh
    healthCheckPath: /api/v1/system/health
    autoDeploy: true
    envVars:
      # NOTE: we deliberately do NOT set NODE_ENV=production at build time to
      # avoid npm skipping devDependencies. The app itself reads NODE_ENV only
      # at runtime; set it via the runtime env (below) instead.
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        fromDatabase:
          name: ayrovi-warehouse-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: SWAGGER_ENABLED
        value: "true"
      - key: CORS_ORIGINS
        value: https://ayrovi-warehouse-core.onrender.com
      - key: INITIAL_ADMIN_CODE
        value: ADMIN001
      - key: INITIAL_ADMIN_PASSWORD
        # Set to a strong value after the first deploy so the seed admin is created.
        sync: false
      - key: WAREHOUSE_INTEGRATION_API_KEY
        # Static shared secret for the Arrival CRM -> Warehouse Expected Arrivals
        # integration. Set it in the Render dashboard (same value as the CRM's
        # WAREHOUSE_API_KEY). Generate with: openssl rand -hex 32
        sync: false
