name: Android Native Build

on:
  push:
    branches:
      - 'arena/**'
    paths:
      - 'mobile/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:
    inputs:
      run_emulator_tests:
        description: 'Run emulator UI/storage tests on a manual build (not physical hardware certification)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: worker-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble:
    name: Core tests, native compile and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile, test and lint
        shell: bash
        run: |
          chmod +x gradlew
          set +e
          ./gradlew :scanner-core:test :worker-core:test :app:assembleDebug :app:lintDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace --console=plain > /tmp/android.log 2>&1
          code=$?
          cat /tmp/android.log
          python3 "$GITHUB_WORKSPACE/.github/workflows/annotate-android.py" "$code" /tmp/android.log
          exit "$code"
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-verification-reports
          path: |
            /tmp/android.log
            mobile/worker-core/build/reports/
            mobile/scanner-core/build/reports/
            mobile/app/build/reports/
      - name: Upload Receiving pilot APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ayrovi-worker-receiving-pilot-${{ github.sha }}
          path: mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      # Deliberately no automatic gh release delete/create. A branch build is
      # not permission for a production cutover or a rolling fleet update.

  emulator:
    name: Handheld UI and storage checks (emulator)
    needs: assemble
    if: github.event_name != 'workflow_dispatch' || inputs.run_emulator_tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          working-directory: mobile
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell wm size 720x1280
            adb shell wm density 320
            adb shell settings put system font_scale 1.0
            set +e; ./gradlew :app:connectedDebugAndroidTest --no-daemon --console=plain; code=$?; mkdir -p /tmp/worker-ui-evidence; adb pull /sdcard/Android/data/com.ayrovi.worker/files/ui-evidence /tmp/worker-ui-evidence || true; exit $code
      - name: Summarize Android test evidence
        if: always()
        working-directory: mobile
        run: python3 ../.github/workflows/annotate-android.py 0 /dev/null --android-only
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-emulator-results
          path: |
            mobile/app/build/reports/androidTests/
            mobile/app/build/outputs/androidTest-results/
            /tmp/worker-ui-evidence/
