name: Android Native Build

on:
  push:
    branches:
      - 'arena/**'
    paths:
      - 'mobile/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

jobs:
  assemble:
    name: Compile app + scanner-core tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure Android 35 platform is installed
        run: |
          echo "y" | sdkmanager --install "platforms;android-35" || true
          echo "y" | sdkmanager --licenses >/dev/null || true

      - name: Ensure debug keystore exists
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Compile + unit tests
        shell: bash
        run: |
          set +e
          chmod +x gradlew
          ./gradlew :scanner-core:test :app:assembleDebug --no-daemon --stacktrace > /tmp/android.log 2>&1
          code=$?
          echo "ANDROID_EXIT=$code"
          python3 -c 'import sys; ls=open("/tmp/android.log",errors="replace").read().splitlines(); start=next((i for i,l in enumerate(ls) if l.startswith("* What went wrong") or l.startswith("> Task")), 0); sel=ls[start:start+160] if start>=0 else ls[-120:]; m="\n".join(sel); print(("::error::"+m.replace("%","%25").replace("\r","").replace("\n","%0A")) if int(sys.argv[1])!=0 else "::notice::Android build + scanner tests OK")' "$code"
          exit $code

      - name: Upload debug APK (artifact)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ayrovi-worker-debug-apk
          path: mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
