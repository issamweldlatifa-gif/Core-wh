name: Build Release APK

on:
  push:
    branches:
      - 'arena/**'
    paths:
      - 'mobile/**'
      - '.github/workflows/build-release-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    name: Assemble Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure Android 35 platform is installed
        run: |
          echo "y" | sdkmanager --install "platforms;android-35" || true
          echo "y" | sdkmanager --licenses >/dev/null || true

      - name: Ensure debug keystore exists (used for this QA release signing)
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build release APK
        working-directory: mobile
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload APK as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: ayrovi-worker-release-apk
          path: mobile/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Commit APK back to branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          APK=mobile/app/build/outputs/apk/release/app-release.apk
          DEST=mobile/ayrovi-worker-v0.2.0-release.apk
          cp "$APK" "$DEST"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          if git commit -m "build(apk): commit compiled release APK v0.2.0 [skip ci]" >/dev/null 2>&1; then
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" "HEAD:${GITHUB_REF_NAME}"
            echo "APK pushed to ${GITHUB_REF_NAME}"
          else
            echo "No changes to commit (APK already present)"
          fi

      - name: Attach APK to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=mobile/app/build/outputs/apk/release/app-release.apk
          TAG="apk-v0.2.0-$(date +%s)"
          gh release create "$TAG" "$APK" \
            --title "AYROVI Worker APK v0.2.0" \
            --notes "Native Android APK (Release) built by GitHub Actions. Signed with the debug keystore (QA installable)." \
            || echo "Release creation failed; APK is still available as an Actions artifact."
