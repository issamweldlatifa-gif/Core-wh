name: Worker Canary Release (from master)

# One-shot helper used to re-cut the internal `worker-canary` release from
# the current master. It builds master's debug APK, proves the WHITE/BLACK
# terminal theme toggle is compiled in, and uploads the APK to the release.
# It deliberately does NOT delete the previous asset, move the tag, or edit
# the release body — those are done by the release operator after verifying
# the new artifact, so the old asset is never removed before the new one is
# proven.

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/01a07746-core-wh'

permissions:
  contents: write

concurrency:
  group: worker-canary-release
  cancel-in-progress: true

jobs:
  build-and-publish:
    name: Build master debug APK and publish to worker-canary
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout master (the canary source)
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Record source commit
        run: |
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          SHORT="$(git rev-parse --short=7 HEAD)"
          echo "SOURCE_COMMIT=${SOURCE_COMMIT}" >> "$GITHUB_ENV"
          echo "SOURCE_SHORT=${SHORT}" >> "$GITHUB_ENV"
          echo "Building canary from commit ${SOURCE_COMMIT}"
          git log -1 --format='%H %s'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --console=plain

      - name: Prove theme toggle feature is present in dex
        run: |
          set -e
          APK=app/build/outputs/apk/debug/app-debug.apk
          MARKERS='CHANGE DISPLAY|toggleTheme|TerminalThemeMode|contrast_mode|ayrovi_terminal_appearance|selectTheme'
          rm -rf /tmp/apkx && mkdir -p /tmp/apkx
          unzip -o -q "$APK" 'classes*.dex' -d /tmp/apkx
          echo "Dex marker counts:"
          grep -a -o -E "$MARKERS" /tmp/apkx/classes*.dex | sort | uniq -c | tee /tmp/dex-evidence.txt
          for m in 'CHANGE DISPLAY' 'toggleTheme' 'TerminalThemeMode' 'contrast_mode'; do
            if ! grep -a -q -F "$m" /tmp/apkx/classes*.dex; then
              echo "::error::required marker not found in dex: $m"
              exit 1
            fi
          done
          echo "Feature evidence OK"

      - name: Checksum and size
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          SHA="$(sha256sum "$APK" | awk '{print $1}')"
          SIZE="$(stat -c %s "$APK")"
          echo "APK_SHA256=${SHA}" >> "$GITHUB_ENV"
          echo "APK_SIZE=${SIZE}" >> "$GITHUB_ENV"
          echo "sha256=${SHA}"
          echo "size=${SIZE}"

      - name: Upload APK to worker-canary release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload worker-canary \
            "app/build/outputs/apk/debug/app-debug.apk#app-debug-${SOURCE_SHORT}.apk" \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Summarize evidence
        if: always()
        run: |
          {
            echo '## Canary build evidence'
            echo ''
            echo "- source commit: \`${SOURCE_COMMIT}\`"
            echo "- apk sha256: \`${APK_SHA256:-not-computed}\`"
            echo "- apk size: \`${APK_SIZE:-not-computed}\` bytes"
            echo ''
            echo '### Dex theme-toggle markers'
            echo '```'
            cat /tmp/dex-evidence.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
