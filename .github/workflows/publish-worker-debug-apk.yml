name: One-shot publish Worker debug APK (arena session helper)
on:
  pull_request:
    branches: [master]
    paths: ['.github/workflows/publish-worker-debug-apk.yml']
permissions:
  contents: write
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Checkout the merged master tree
        run: git checkout origin/master && git rev-parse HEAD
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile + assemble debug APK
        working-directory: mobile
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :scanner-core:test :worker-core:test :app:assembleDebug --no-daemon --console=plain
      - name: Stage APK + checksums
        working-directory: mobile
        run: |
          set -euo pipefail
          SHORT=$(git rev-parse --short=7 HEAD)
          cp app/build/outputs/apk/debug/app-debug.apk "app-debug-${SHORT}.apk"
          sha256sum "app-debug-${SHORT}.apk" | tee SHA256SUMS
          echo "TAG=worker-canary-ocr-${SHORT}" >> "$GITHUB_ENV"
          echo "APK_ASSET=app-debug-${SHORT}.apk" >> "$GITHUB_ENV"
          echo "SRC_SHA=${SHORT}" >> "$GITHUB_ENV"
      - name: Publish GitHub Release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then echo "tag $TAG exists"; exit 1; fi
          gh release create "$TAG" "mobile/${APK_ASSET}" "mobile/SHA256SUMS" \
            --title "AYROVI Worker 1.5.1-rc1 (build 45) + DIRECTED OCR — debug QA APK" \
            --notes "Debug QA APK from master ${SRC_SHA}. Contains directed-OCR with the strict compact-SKU template (s + letter + 1..20 digits) for label reading. Source: https://github.com/issamweldlatifa-gif/Core-wh/commit/${SRC_SHA}" \
            --prerelease
