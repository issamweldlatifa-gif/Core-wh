# AYROVI Warehouse Core — Frontend nginx (SPA)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback so client-side routes resolve.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # In production the backend is typically served from a subdomain/API host.
    # If frontend & API share this origin, point /api at the backend service.
    # Otherwise, set VITE_API_BASE to the API URL at build time.
    location /api/ {
        # Example: proxy to the backend container (uncomment + adjust).
        # proxy_pass http://backend:3000;
        # proxy_set_header Host $host;
        # proxy_set_header X-Forwarded-Proto $scheme;
        return 200 '{"status":"ok","service":"frontend"}';
        add_header Content-Type application/json;
    }
}
