# AYROVI Warehouse Core — Frontend nginx (SPA)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback so client-side routes resolve.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend container so the SPA and the API share
    # one origin (the frontend is built with VITE_API_BASE=/api).
    # NOTE: this used to `return 200 '{"status":"ok"}'` which silently broke
    # every API call from the dockerised frontend.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
